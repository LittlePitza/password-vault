<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Password Vault. A local password manager for Chrome and Edge.">
  <!-- README banner. Colours are the tokens in src/ui/tokens.css (night scale, green-300/500,
       navy-900, slate-400, paper); the key mark is design-system/pimsa-password-vault/icon.svg. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1b2e"/>
      <stop offset="1" stop-color="#090a0c"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0cd75"/>
      <stop offset="1" stop-color="#7f9d41"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#0e1b2e" stop-opacity="1"/>
      <stop offset="1" stop-color="#0e1b2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night ground with the navy-900 light falling on the key hierarchy -->
  <rect width="1280" height="320" fill="#050608"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Chrome labels -->
  <g font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#8a94a3">
    <text x="64" y="44">MANIFEST V3 / WXT / REACT 19</text>
    <text x="1216" y="44" text-anchor="end">NO SERVER / NO ACCOUNT / NO SYNC</text>
    <text x="64" y="284">AES-256-GCM / SCRYPT N=2^17 R=8 P=2</text>
  </g>

  <!-- Icon tile, after the extension icon (128 viewBox scaled to 112) -->
  <g transform="translate(64 96) scale(0.875)">
    <rect width="128" height="128" rx="28.8" fill="url(#tile)" stroke="#242a33" stroke-width="1.5"/>
    <path fill="url(#key)" d="M 58.50 60.80 L 51.20 97.28 L 76.80 97.28 L 69.50 60.80 Z"/>
    <circle cx="64" cy="51.2" r="19.46" fill="url(#key)"/>
  </g>

  <!-- Name -->
  <text x="208" y="168" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#f7f8f5">Password Vault</text>
  <text x="210" y="206" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#b0cd75">LOCAL PASSWORD MANAGER</text>
  <text x="210" y="232" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="15" letter-spacing="2" fill="#8a94a3">For Chrome and Edge. The vault never leaves the device.</text>

  <!-- Motif: two recipients, one DEK, every item -->
  <g font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">
    <!-- wires -->
    <g fill="none" stroke="#5d86b9" stroke-width="1.5">
      <path d="M 912 118 H 950 Q 964 118 964 132 V 146 Q 964 160 978 160 H 986"/>
      <path d="M 912 202 H 950 Q 964 202 964 188 V 174 Q 964 160 978 160 H 986"/>
    </g>
    <path d="M 1034 160 H 1074" stroke="#b0cd75" stroke-width="1.5" fill="none"/>
    <g fill="none" stroke="#b0cd75" stroke-width="1.5" opacity="0.6">
      <path d="M 1074 160 V 118 H 1084"/>
      <path d="M 1074 160 H 1084"/>
      <path d="M 1074 160 V 202 H 1084"/>
    </g>

    <!-- recipients -->
    <rect x="752" y="98" width="160" height="40" rx="8" fill="#111419" stroke="#242a33"/>
    <text x="768" y="115" fill="#f7f8f5">MASTER PASSWORD</text>
    <text x="768" y="129" fill="#8a94a3">scrypt, own salt</text>
    <rect x="752" y="182" width="160" height="40" rx="8" fill="#111419" stroke="#242a33"/>
    <text x="768" y="199" fill="#f7f8f5">RECOVERY CODE</text>
    <text x="768" y="213" fill="#8a94a3">scrypt, own salt</text>

    <!-- DEK -->
    <circle cx="1010" cy="160" r="24" fill="url(#key)"/>
    <text x="1010" y="164" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#050608">DEK</text>

    <!-- items -->
    <rect x="1084" y="104" width="132" height="28" rx="6" fill="#171b21" stroke="#242a33"/>
    <text x="1098" y="122" fill="#8a94a3">item  AES-GCM</text>
    <rect x="1084" y="146" width="132" height="28" rx="6" fill="#171b21" stroke="#242a33"/>
    <text x="1098" y="164" fill="#8a94a3">item  AES-GCM</text>
    <rect x="1084" y="188" width="132" height="28" rx="6" fill="#171b21" stroke="#242a33"/>
    <text x="1098" y="206" fill="#8a94a3">item  AES-GCM</text>
  </g>
</svg>
